<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Storyboard Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
        html, body { height: 100%; overflow: hidden; }

        /* 企业级滚动条 */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #cbd5e1; }

        /* 视图切换 */
        .view-transition { transition: opacity 0.3s ease, transform 0.3s ease; }
        .view-hidden { opacity: 0; pointer-events: none; position: absolute; inset: 0; }

        /* 卡片样式 - 企业级亮色 */
        .card { background: white; border: 1px solid #e2e8f0; border-radius: 8px; }
        .card-header { padding: 12px 16px; border-bottom: 1px solid #f1f5f9; }
        .card-body { padding: 16px; }

        /* 分段控制器 */
        .segment-control { display: inline-flex; background: #f1f5f9; border-radius: 6px; padding: 2px; }
        .segment-btn { padding: 6px 14px; font-size: 13px; font-weight: 500; color: #64748b; border-radius: 4px; cursor: pointer; transition: all 0.15s; }
        .segment-btn:hover { color: #334155; }
        .segment-btn.active { background: white; color: #0f172a; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }

        /* 上传区域 */
        .upload-zone { border: 1.5px dashed #e2e8f0; border-radius: 8px; transition: all 0.2s; cursor: pointer; }
        .upload-zone:hover { border-color: #94a3b8; background: #fafafa; }
        .upload-zone.dragover { border-color: #6366f1; background: #eef2ff; }

        /* 图片网格 */
        .image-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 8px; }
        .image-thumb { position: relative; aspect-ratio: 1; border-radius: 6px; overflow: hidden; border: 1px solid #e2e8f0; }
        .image-thumb img { width: 100%; height: 100%; object-fit: cover; }
        .image-thumb .remove-btn { position: absolute; top: 2px; right: 2px; width: 18px; height: 18px; background: rgba(239,68,68,0.9); border-radius: 50%; display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.15s; cursor: pointer; }
        .image-thumb:hover .remove-btn { opacity: 1; }

        /* 历史记录项 */
        .history-item { position: relative; padding: 10px 12px; border-radius: 6px; cursor: pointer; transition: background 0.15s; }
        .history-item:hover { background: #f8fafc; }
        .history-item.active { background: #f0fdf4; }
        .history-item.active .history-name { color: #166534; font-weight: 600; }
        .history-actions { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); display: flex; gap: 4px; opacity: 0; transition: opacity 0.15s; }
        .history-item:hover .history-actions { opacity: 1; }
        .history-action-btn { width: 24px; height: 24px; border-radius: 4px; display: flex; align-items: center; justify-content: center; color: #64748b; transition: all 0.15s; }
        .history-action-btn:hover { background: #e2e8f0; color: #334155; }
        .history-action-btn.delete:hover { background: #fee2e2; color: #dc2626; }

        /* Toast */
        .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(100px); padding: 10px 20px; background: #0f172a; border-radius: 8px; color: white; font-size: 14px; font-weight: 500; z-index: 1000; opacity: 0; transition: all 0.25s ease; }

        /* Modal */
        .modal-overlay { position: fixed; inset: 0; background: rgba(15,23,42,0.4); backdrop-filter: blur(4px); z-index: 100; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
        .modal-overlay.show { opacity: 1; pointer-events: auto; }
        .modal-box { background: white; border-radius: 12px; border: 1px solid #e2e8f0; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); width: 90%; max-width: 800px; max-height: 80vh; overflow: hidden; transform: scale(0.95); transition: transform 0.2s; }
        .modal-overlay.show .modal-box { transform: scale(1); }

        /* Console 表格 */
        .console-content { background: white; border: 1px solid #e2e8f0; border-radius: 8px; overflow: hidden; }
        .console-content table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .console-content th { background: #f8fafc; padding: 10px 12px; text-align: center; font-weight: 600; color: #334155; border-bottom: 1px solid #e2e8f0; white-space: nowrap; }
        .console-content td { padding: 12px; border-bottom: 1px solid #f1f5f9; text-align: center; vertical-align: middle; }
        .console-content tr:hover td { background: #fafafa; }

        /* Prompt 单元格操作 */
        .prompt-cell { position: relative; }
        .prompt-cell .actions { position: absolute; top: 4px; right: 4px; display: flex; gap: 3px; opacity: 0; transition: opacity 0.15s; }
        .prompt-cell:hover .actions { opacity: 1; }
        .action-btn { width: 26px; height: 26px; border-radius: 4px; display: flex; align-items: center; justify-content: center; color: white; cursor: pointer; transition: transform 0.1s; }
        .action-btn:hover { transform: scale(1.1); }
        .copy-btn { background: #3b82f6; }
        .expand-btn { background: #8b5cf6; }

        /* 打字机光标 */
        .typewriter-cursor { display: inline-block; width: 1.5px; height: 1em; background: #6366f1; margin-left: 1px; animation: blink 0.8s infinite; }
        @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }

        /* 输入框 */
        input, textarea { font-family: inherit; }
        input:focus, textarea:focus { outline: none; border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99,102,241,0.1); }

        /* 按钮 */
        .btn-primary { background: #0f172a; color: white; padding: 8px 16px; border-radius: 6px; font-size: 13px; font-weight: 500; transition: background 0.15s; }
        .btn-primary:hover { background: #1e293b; }
        .btn-primary:disabled { background: #94a3b8; cursor: not-allowed; }
        .btn-secondary { background: white; color: #334155; border: 1px solid #e2e8f0; padding: 8px 16px; border-radius: 6px; font-size: 13px; font-weight: 500; transition: all 0.15s; }
        .btn-secondary:hover { background: #f8fafc; border-color: #cbd5e1; }

        /* Spinner */
        .spinner { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 0.7s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .spinner-dark { border-color: rgba(0,0,0,0.1); border-top-color: #0f172a; }
    </style>
</head>
<body class="bg-slate-50">
    <div class="flex h-screen w-screen overflow-hidden">
        <!-- ==================== 左侧边栏 ==================== -->
        <aside class="w-[260px] bg-white border-r border-slate-200 flex flex-col flex-shrink-0">
            <!-- Logo -->
            <div class="p-4 border-b border-slate-100">
                <div class="flex items-center gap-3 mb-4">
                    <div class="w-8 h-8 bg-slate-900 rounded-lg flex items-center justify-center">
                        <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                        </svg>
                    </div>
                    <div>
                        <h1 class="text-sm font-semibold text-slate-900">Storyboard</h1>
                        <p class="text-[10px] text-slate-400">AI Studio</p>
                    </div>
                </div>
                <button onclick="createNewProject()" class="w-full bg-slate-900 hover:bg-slate-800 text-white text-sm font-medium py-2.5 px-4 rounded-lg flex items-center justify-center gap-2 transition-colors">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                    新建项目
                </button>
            </div>

            <!-- 历史列表 -->
            <div class="flex-1 overflow-y-auto p-3">
                <div class="text-[10px] text-slate-400 uppercase tracking-wider font-semibold mb-2 px-2">历史记录</div>
                <div id="historyList" class="space-y-0.5"></div>
            </div>

            <!-- 底部版权 -->
            <div class="p-3 border-t border-slate-100 text-center">
                <p class="text-[10px] text-slate-400">© 2026 浩涵 All Rights Reserved</p>
            </div>
        </aside>

        <!-- ==================== 右侧主区域 ==================== -->
        <main class="flex-1 flex flex-col overflow-hidden relative">
            <!-- 视图 A: 输入页 -->
            <div id="inputView" class="view-transition flex-1 flex flex-col overflow-hidden">
                <div class="flex-1 overflow-y-auto p-6">
                    <div class="max-w-3xl mx-auto space-y-5">
                        <!-- 标题 -->
                        <div class="text-center mb-6">
                            <h2 class="text-xl font-semibold text-slate-900 mb-1">创建分镜脚本</h2>
                            <p class="text-sm text-slate-500">上传产品图 → 提取特征 → 生成专业脚本</p>
                        </div>

                        <!-- Phase 1: 资产锚定 -->
                        <div class="card">
                            <div class="card-header flex items-center gap-3">
                                <div class="w-6 h-6 bg-slate-900 text-white rounded flex items-center justify-center text-xs font-semibold">1</div>
                                <div>
                                    <h3 class="text-sm font-semibold text-slate-900">产品资产锚定</h3>
                                    <p class="text-[11px] text-slate-500">提取产品视觉特征作为锚定词</p>
                                </div>
                            </div>
                            <div class="card-body space-y-4">
                                <!-- 项目名称 -->
                                <div>
                                    <label class="block text-xs font-medium text-slate-600 mb-1.5">项目名称</label>
                                    <input type="text" id="projectName" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm" placeholder="例如：智能手表产品视频">
                                </div>

                                <!-- 产品图片 -->
                                <div>
                                    <label class="block text-xs font-medium text-slate-600 mb-1.5">产品图片（最多10张）</label>
                                    <div id="uploadArea">
                                        <!-- 动态渲染上传区域 -->
                                    </div>
                                </div>

                                <!-- 提取按钮 -->
                                <button onclick="analyzeProduct()" id="analyzeBtn" class="btn-primary w-full py-2.5 flex items-center justify-center gap-2">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"></path></svg>
                                    提取产品特征
                                </button>

                                <!-- 锚定词 -->
                                <div>
                                    <label class="block text-xs font-medium text-slate-600 mb-1.5">锚定描述词</label>
                                    <div class="relative">
                                        <textarea id="anchorPrompt" rows="3" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm font-mono resize-none" placeholder="提取后将显示产品特征描述..."></textarea>
                                        <span id="anchorCursor" class="typewriter-cursor absolute hidden" style="top: 10px; left: 14px;"></span>
                                    </div>
                                    <button onclick="useAnchorPrompt()" id="useAnchorBtn" class="mt-2 text-xs text-indigo-600 hover:text-indigo-800 font-medium hidden flex items-center gap-1">
                                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"></path></svg>
                                        使用此锚定词继续生成
                                    </button>
                                </div>
                            </div>
                        </div>

                        <!-- Phase 2: 分镜生成 -->
                        <div class="card">
                            <div class="card-header flex items-center gap-3">
                                <div class="w-6 h-6 bg-slate-900 text-white rounded flex items-center justify-center text-xs font-semibold">2</div>
                                <div>
                                    <h3 class="text-sm font-semibold text-slate-900">分镜脚本生成</h3>
                                    <p class="text-[11px] text-slate-500">上传需求表，生成专业分镜</p>
                                </div>
                            </div>
                            <div class="card-body space-y-4">
                                <!-- 画幅选择 -->
                                <div>
                                    <label class="block text-xs font-medium text-slate-600 mb-1.5">画幅比例</label>
                                    <div class="segment-control">
                                        <div class="segment-btn active" data-value="16:9" onclick="selectAR(this)">16:9 横屏</div>
                                        <div class="segment-btn" data-value="9:16" onclick="selectAR(this)">9:16 竖屏</div>
                                    </div>
                                </div>

                                <!-- 需求表上传 -->
                                <div>
                                    <label class="block text-xs font-medium text-slate-600 mb-1.5">镜头需求表</label>
                                    <div id="requirementsUploadArea">
                                        <div id="uploadZone2" class="upload-zone p-8 text-center">
                                            <input type="file" id="requirementsFile" accept=".csv,.xlsx,.xls" class="hidden">
                                            <div class="flex flex-col items-center gap-2">
                                                <div class="w-10 h-10 bg-slate-100 rounded-lg flex items-center justify-center">
                                                    <svg class="w-5 h-5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                                                </div>
                                                <div>
                                                    <p class="text-sm font-medium text-slate-600">点击或拖拽上传需求表</p>
                                                    <p class="text-xs text-slate-400 mt-0.5">支持 CSV, Excel 格式</p>
                                                </div>
                                            </div>
                                        </div>
                                        <div id="fileInfo" class="hidden mt-2 p-3 bg-slate-50 rounded-lg border border-slate-200 flex items-center gap-3">
                                            <div class="w-8 h-8 bg-slate-200 rounded flex items-center justify-center">
                                                <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                                            </div>
                                            <div class="flex-1 min-w-0">
                                                <p id="fileName" class="text-sm font-medium text-slate-700 truncate"></p>
                                                <p class="text-[10px] text-slate-400">已上传</p>
                                            </div>
                                            <button onclick="removeFile()" class="text-xs text-slate-500 hover:text-red-600">删除</button>
                                        </div>
                                    </div>
                                </div>

                                <!-- 生成按钮 -->
                                <button onclick="generateScript()" id="generateBtn" class="btn-primary w-full py-2.5 flex items-center justify-center gap-2">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                                    生成专业脚本
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 视图 B: Console -->
            <div id="consoleView" class="view-transition view-hidden flex-1 flex flex-col overflow-hidden">
                <!-- 工具栏 -->
                <div class="px-5 py-3 border-b border-slate-200 bg-white flex items-center justify-between flex-shrink-0">
                    <div class="flex items-center gap-3">
                        <div class="flex items-center gap-2">
                            <div class="w-2.5 h-2.5 rounded-full bg-red-400"></div>
                            <div class="w-2.5 h-2.5 rounded-full bg-yellow-400"></div>
                            <div class="w-2.5 h-2.5 rounded-full bg-green-400"></div>
                        </div>
                        <span class="text-xs text-slate-500 font-mono">Storyboard Console</span>
                        <span id="arBadge" class="px-2 py-0.5 bg-slate-100 text-slate-600 text-[10px] font-medium rounded">16:9</span>
                    </div>
                    <div class="flex items-center gap-4">
                        <span id="statusText" class="text-xs text-slate-400">就绪</span>
                        <span id="charCount" class="text-xs text-slate-400">0 个字符</span>
                        <button onclick="copyConsole()" class="text-xs text-slate-500 hover:text-slate-900">复制</button>
                        <button onclick="downloadConsole()" class="text-xs text-slate-500 hover:text-slate-900">下载</button>
                        <button onclick="switchToInput()" class="btn-secondary py-1.5 px-3 text-xs">返回编辑</button>
                    </div>
                </div>

                <!-- Console 内容 -->
                <div class="flex-1 overflow-y-auto p-5 bg-slate-50">
                    <div id="console" class="console-content p-5 min-h-full">
                        <div class="text-center py-16">
                            <div class="w-12 h-12 mx-auto bg-slate-100 rounded-xl flex items-center justify-center mb-4">
                                <div class="spinner spinner-dark"></div>
                            </div>
                            <p class="text-sm font-medium text-slate-600">正在生成...</p>
                            <p class="text-xs text-slate-400 mt-1">请稍候，分镜脚本生成中</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- 详情 Modal -->
    <div id="detailModal" class="modal-overlay" onclick="closeDetail(event)">
        <div class="modal-box" onclick="event.stopPropagation()">
            <div class="p-4 border-b border-slate-100 flex items-center justify-between">
                <h3 class="text-sm font-semibold text-slate-900">提示词详情</h3>
                <button onclick="closeDetail()" class="text-slate-400 hover:text-slate-600">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <div class="p-4 max-h-[50vh] overflow-y-auto">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-[10px] text-slate-400 uppercase tracking-wider font-semibold mb-2">English Prompt</label>
                        <div id="detailEnglish" class="bg-slate-900 p-4 rounded-lg font-mono text-cyan-300 text-sm leading-relaxed"></div>
                    </div>
                    <div>
                        <label class="block text-[10px] text-slate-400 uppercase tracking-wider font-semibold mb-2">中文翻译</label>
                        <div id="detailChinese" class="bg-slate-50 p-4 rounded-lg text-slate-600 text-sm leading-relaxed border border-slate-200"></div>
                    </div>
                </div>
            </div>
            <div class="p-4 border-t border-slate-100 flex gap-3 justify-end">
                <button onclick="copyDetailAll()" class="btn-primary">复制全部</button>
                <button onclick="closeDetail()" class="btn-secondary">关闭</button>
            </div>
        </div>
    </div>

    <!-- 重命名 Modal -->
    <div id="renameModal" class="modal-overlay" onclick="closeRename(event)">
        <div class="modal-box max-w-sm" onclick="event.stopPropagation()">
            <div class="p-4 border-b border-slate-100 flex items-center justify-between">
                <h3 class="text-sm font-semibold text-slate-900">重命名项目</h3>
                <button onclick="closeRename()" class="text-slate-400 hover:text-slate-600">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <div class="p-4">
                <input type="text" id="renameInput" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm">
            </div>
            <div class="p-4 border-t border-slate-100 flex gap-3 justify-end">
                <button onclick="closeRename()" class="btn-secondary">取消</button>
                <button onclick="confirmRename()" class="btn-primary">保存</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast"></div>

    <script>
        // ==================== 全局状态 ====================
        let uploadedImages = [];
        let currentProjectId = null;
        let accumulatedContent = '';
        let selectedAR = '16:9';
        let currentDetailEN = '';
        let currentDetailCN = '';
        let renamingProjectId = null;
        let typewriterTimer = null;
        let typewriterText = '';
        let typewriterIndex = 0;
        const MAX_IMAGES = 10;

        // ==================== 初始化 ====================
        document.addEventListener('DOMContentLoaded', () => {
            loadHistory();
            renderUploadArea();
            setupRequirementsUpload();
        });

        // ==================== 上传区域渲染 ====================
        function renderUploadArea() {
            const area = document.getElementById('uploadArea');
            if (uploadedImages.length === 0) {
                // 初始状态：大虚线框
                area.innerHTML = `
                    <div id="uploadZone1" class="upload-zone p-10 text-center">
                        <input type="file" id="productImages" multiple accept="image/*" class="hidden">
                        <div class="flex flex-col items-center gap-2">
                            <div class="w-12 h-12 bg-slate-100 rounded-xl flex items-center justify-center">

        function setupImageUpload() {
            const zone = document.getElementById('uploadZone1');
            const input = document.getElementById('productImages');
            if (!zone || !input) return;
            
            zone.addEventListener('click', () => input.click());
            zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('dragover'); });
            zone.addEventListener('dragleave', () => zone.classList.remove('dragover'));
            zone.addEventListener('drop', e => { e.preventDefault(); zone.classList.remove('dragover'); handleImageFiles(e.dataTransfer.files); });
            input.addEventListener('change', () => handleImageFiles(input.files));
        }

        async function handleImageFiles(files) {
            const remaining = MAX_IMAGES - uploadedImages.length;
            const filesToAdd = Array.from(files).slice(0, remaining);
            
            for (const file of filesToAdd) {
                if (file.type.startsWith('image/')) {
                    const compressed = await compressImageFile(file);
                    const reader = new FileReader();
                    reader.onload = e => {
                        uploadedImages.push({ file: compressed, preview: e.target.result });
                        renderUploadArea();
                    };
                    reader.readAsDataURL(compressed);
                }
            }
        }

        async function handleAddMoreImages(files) {
            await handleImageFiles(files);
        }

        async function compressImageFile(file, maxSize = 1024, quality = 0.85) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let w = img.width, h = img.height;
                    if (w > maxSize || h > maxSize) { const r = Math.min(maxSize / w, maxSize / h); w = Math.round(w * r); h = Math.round(h * r); }
                    canvas.width = w; canvas.height = h;
                    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                    canvas.toBlob(blob => blob ? resolve(new File([blob], file.name, { type: 'image/jpeg' })) : resolve(file), 'image/jpeg', quality);
                };
                img.onerror = reject;
                img.src = URL.createObjectURL(file);
            });
        }

        function removeImage(index) {

        function formatDate(str) {
            const d = new Date(str), now = new Date();
            const diff = now - d;
            if (diff < 60000) return '刚刚';
            if (diff < 3600000) return `${Math.floor(diff/60000)}分钟前`;
            if (diff < 86400000) return `${Math.floor(diff/3600000)}小时前`;
            return d.toLocaleDateString('zh-CN');
        }

        // ==================== 阶段一：产品分析（流式打字机） ====================
        function startTypewriter(text) {
            typewriterText = text;

            const textarea = document.getElementById('anchorPrompt');
            textarea.value = '';
            document.getElementById('anchorCursor').classList.remove('hidden');
            document.getElementById('anchorCursor').style.display = 'inline-block';
            document.getElementById('useAnchorBtn').classList.add('hidden');

            function typeStep() {
                if (typewriterIndex < typewriterText.length) {
                    textarea.value += typewriterText.charAt(typewriterIndex);
                    typewriterIndex++;
                    typewriterTimer = setTimeout(typeStep, 20);
                } else {
                    document.getElementById('anchorCursor').classList.add('hidden');
                    document.getElementById('useAnchorBtn').classList.remove('hidden');
                }
            }
            typeStep();
        }

        async function analyzeProduct() {
            const productName = document.getElementById('projectName').value.trim() || '未命名';
            const btn = document.getElementById('analyzeBtn');

            if (uploadedImages.length === 0) { showToast('请上传产品图片'); return; }

            btn.disabled = true;
            btn.innerHTML = '<div class="spinner"></div> 分析中...';
            clearTimeout(typewriterTimer);

            const formData = new FormData();
            formData.append('product_name', productName);
            uploadedImages.forEach(img => formData.append('images', img.file));

            try {
                const res = await fetch('/api/analyze_product', { method: 'POST', body: formData });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);

                const reader = res.body.getReader();
                const decoder = new TextDecoder();
                let fullText = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    const chunk = decoder.decode(value, { stream: true });
                    for (const line of chunk.split('\n')) {
                        if (line.startsWith('data: ')) {
                            try {
                                const data = JSON.parse(line.slice(6));
                                if (data.type === 'chunk') {
                                    fullText = data.accumulated;
                                    startTypewriter(fullText);
                                } else if (data.type === 'done') {
                                    btn.disabled = false;
                                    btn.innerHTML = '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"></path></svg> 提取产品特征';
                                    showToast('✅ 特征提取完成');

                                    fetch('/api/analyze_product/save', {
                                        method: 'POST',
                                        headers: { 'Content-Type': 'application/json' },
                                        body: JSON.stringify({ anchor_prompt: fullText, product_name: productName })
                                    })
                                    .then(r => r.json())
                                    .then(data => { if (data.success) currentProjectId = data.project_id; });
                                } else if (data.type === 'error') {
                                    showToast('❌ ' + data.message);
                                    btn.disabled = false;
                                    btn.innerHTML = '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"></path></svg> 提取产品特征';
                                }
                            } catch (e) {}
                        }
                    }
                }
            } catch (err) {
                console.error(err);
                showToast('❌ 网络错误');
                btn.disabled = false;
                btn.innerHTML = '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"></path></svg> 提取产品特征';
            }
        }

        // ==================== 阶段二：分镜生成 ====================
        async function generateScript() {
            const anchorPrompt = document.getElementById('anchorPrompt').value.trim();
            const reqFile = document.getElementById('requirementsFile').files[0];
            const btn = document.getElementById('generateBtn');

            if (!anchorPrompt) { showToast('请先提取产品特征'); return; }

            btn.disabled = true;
            btn.innerHTML = '<div class="spinner"></div> 生成中...';
            switchToConsole();

            accumulatedContent = '';
            clearConsole();
            setStatus('生成中...');

            const formData = new FormData();
            formData.append('anchor_prompt', anchorPrompt);
            formData.append('project_id', currentProjectId || '');
            formData.append('aspect_ratio', selectedAR);
            if (reqFile) formData.append('requirements', reqFile);

            try {
                const res = await fetch('/api/generate_script', { method: 'POST', body: formData });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);

                const reader = res.body.getReader();
                const decoder = new TextDecoder();

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    const chunk = decoder.decode(value, { stream: true });
                    for (const line of chunk.split('\n')) {
                        if (line.startsWith('data: ')) {
                            try { handleStreamEvent(JSON.parse(line.slice(6))); } catch (e) {}
                        }
                    }
                }
            } catch (err) {
                console.error(err);
                showToast('❌ 生成失败');
                setStatus('生成失败');
                btn.disabled = false;
                btn.innerHTML = '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg> 生成专业脚本';
            }
        }

        // ==================== 流式处理 ====================
        function handleStreamEvent(data) {
            const btn = document.getElementById('generateBtn');

            switch (data.type) {
                case 'start':
                    document.getElementById('console').innerHTML = '<div class="text-center py-16"><div class="w-12 h-12 mx-auto bg-slate-100 rounded-xl flex items-center justify-center mb-4"><div class="spinner spinner-dark"></div></div><p class="text-sm font-medium text-slate-600">正在生成...</p></div>';
                    setStatus(data.message);
                    break;
                case 'chunk':
                    accumulatedContent += data.content;
                    document.getElementById('charCount').textContent = `${accumulatedContent.length} 个字符`;
                    renderConsole(accumulatedContent);
                    break;
                case 'done':
                    setStatus('生成完成');
                    showToast('✅ 脚本生成完成');
                    loadHistory();
                    btn.disabled = false;
                    btn.innerHTML = '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg> 生成专业脚本';
                    break;
                case 'error':
                    setStatus('生成失败');
                    showToast('❌ ' + data.message);
                    btn.disabled = false;
                    btn.innerHTML = '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg> 生成专业脚本';
                    break;
                case 'saved':
                    showToast('✅ 已保存到历史');
                    break;
            }
        }

        function renderConsole(content) {
            const consoleEl = document.getElementById('console');
            // 先渲染 Markdown
            let html = marked.parse(content);
            consoleEl.innerHTML = html;
            
            // 后处理：解析 <!--cn:...--> 注释并转换为 span
            const walker = document.createTreeWalker(consoleEl, NodeFilter.SHOW_TEXT);
            const textNodes = [];
            while (walker.nextNode()) textNodes.push(walker.currentNode);
            
            textNodes.forEach(node => {
                const match = node.textContent.match(/^<!--cn:(.+):-->$/);
                if (match) {
                    const span = document.createElement('span');
                    span.className = 'prompt-cn';
                    span.style.display = 'none';
                    span.textContent = match[1];
                    node.parentNode.replaceChild(span, node);
                }
            });
            
            // 为英文提示词添加悬浮效果
            consoleEl.querySelectorAll('table tbody tr').forEach(row => {
                const cells = row.querySelectorAll('td');
                if (cells.length >= 5) {
                    [3, 4].forEach(idx => {
                        const cell = cells[idx];
                        if (!cell.classList.contains('processed')) {
                            cell.classList.add('prompt-cell', 'processed');
                            const cnSpan = cell.querySelector('.prompt-cn');
                            const englishText = cell.textContent.replace(/<!--cn:.*?-->/g, '').trim();
                            
                            if (cnSpan) {
                                cell.setAttribute('title', cnSpan.textContent);
                                cell.style.cursor = 'pointer';
                                cell.style.borderBottom = '1px dashed #94a3b8';
                            }
                            
                            // 添加操作按钮
                            const actions = document.createElement('div');
                            actions.className = 'actions';
                            actions.innerHTML = `
                                <div class="action-btn copy-btn" onclick="copyCellText(this)" title="复制">
                                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                                </div>
                                <div class="action-btn expand-btn" onclick="expandCell(this)" title="放大">
                                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v3m0 0v3m0-3h3m-3 0H7"></path></svg>
                                </div>
                            `;
                            cell.style.position = 'relative';
                            cell.appendChild(actions);
                        }
                    });
                }
            });
            
            consoleEl.scrollTop = 0;
        }

        function copyCellText(btn) {
            const cell = btn.closest('td');
            const cnSpan = cell.querySelector('.prompt-cn');
            const text = cnSpan ? cnSpan.textContent : cell.textContent.replace(/<!--cn:.*?-->/g, '').trim();

        // ==================== 控制台 ====================
        function setStatus(text) { document.getElementById('statusText').textContent = text; }

        function clearConsole() {
            accumulatedContent = '';
            document.getElementById('console').innerHTML = '<div class="text-center py-16"><div class="w-12 h-12 mx-auto bg-slate-100 rounded-xl flex items-center justify-center mb-4"><div class="spinner spinner-dark"></div></div><p class="text-sm font-medium text-slate-600">正在生成...</p><p class="text-xs text-slate-400 mt-1">请稍候</p></div>';
            document.getElementById('charCount').textContent = '0 个字符';
            setStatus('就绪');
        }

        function copyConsole() {
            if (accumulatedContent) navigator.clipboard.writeText(accumulatedContent).then(() => showToast('✅ 已复制'));
        }

        function downloadConsole() {
            if (accumulatedContent) {
                const blob = new Blob([accumulatedContent], { type: 'text/markdown' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = `分镜_${new Date().toISOString().slice(0,10)}.md`;
                a.click();
                URL.revokeObjectURL(a.href);
                showToast('开始下载');
            }
        }

        // ==================== 工具 ====================
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }
    </script>
</body>
</html>
