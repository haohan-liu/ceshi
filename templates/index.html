<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 商业视频制片工作台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.2.0/github-markdown.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }

        /* 控制台样式 */
        .console-output {
            font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
            line-height: 1.7;
        }
        .console-output table {
            border-collapse: collapse;
            width: 100%;
            margin: 16px 0;
        }
        .console-output table th {
            background: #334155;
            border: 1px solid #475569;
            padding: 12px;
            text-align: left;
            font-weight: 600;
            color: #e2e8f0;
        }
        .console-output table td {
            border: 1px solid #475569;
            padding: 10px;
            vertical-align: top;
            color: #e2e8f0;
        }
        .console-output table tr:nth-child(even) {
            background: #1e293b;
        }
        .console-output pre {
            background: #1e293b;
            border-radius: 6px;
            padding: 12px;
            overflow-x: auto;
        }
        .console-output code {
            background: #334155;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 13px;
            color: #a5f3fc;
        }
        .console-output pre code {
            background: transparent;
            padding: 0;
        }

        /* 打字机光标 */
        .typing-cursor::after {
            content: '▋';
            animation: blink 1s infinite;
            color: #06b6d4;
        }
        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        /* 滚动条 */
        .scrollbar-thin::-webkit-scrollbar { width: 6px; }
        .scrollbar-thin::-webkit-scrollbar-track { background: #1e293b; }
        .scrollbar-thin::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
        .scrollbar-thin::-webkit-scrollbar-thumb:hover { background: #64748b; }

        /* 图片预览 */
        .image-preview-card {
            position: relative;
            aspect-ratio: 1;
            overflow: hidden;
            border-radius: 8px;
            border: 2px solid #e2e8f0;
            transition: all 0.2s;
        }
        .image-preview-card:hover {
            border-color: #818cf8;
            transform: scale(1.02);
        }
        .image-preview-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .image-preview-card .delete-btn {
            position: absolute;
            top: 4px;
            right: 4px;
            width: 24px;
            height: 24px;
            background: #ef4444;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s;
            cursor: pointer;
        }
        .image-preview-card:hover .delete-btn {
            opacity: 1;
        }
        .image-preview-card .delete-btn svg {
            width: 14px;
            height: 14px;
            color: white;
        }

        /* 加载动画 */
        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid #475569;
            border-top-color: #06b6d4;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            padding: 12px 20px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #e2e8f0;
            font-size: 14px;
            z-index: 1000;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s ease;
        }
        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">
    <!-- 顶部导航 -->
    <nav class="bg-white border-b border-slate-200 px-6 py-4">
        <div class="flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-xl flex items-center justify-center">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                    </svg>
                </div>
                <div>
                    <h1 class="text-lg font-bold text-slate-800">AI 商业视频制片工作台</h1>
                    <p class="text-xs text-slate-500">多模态智能分镜生成系统</p>
                </div>
            </div>
            <div class="flex items-center gap-2 text-sm text-slate-500">
                <span class="w-2 h-2 bg-emerald-500 rounded-full"></span>
                系统就绪
            </div>
        </div>
    </nav>

    <!-- 主体区域 -->
    <div class="grid grid-cols-12 min-h-[calc(100vh-73px)]">
        <!-- 左侧控制区 -->
        <aside class="col-span-4 bg-white border-r border-slate-200 flex flex-col overflow-hidden">
            <!-- 历史记录 -->
            <div class="p-4 border-b border-slate-200">
                <div class="flex items-center justify-between mb-3">
                    <h3 class="text-sm font-semibold text-slate-700">历史项目</h3>
                    <button onclick="clearConsole()" class="text-xs text-slate-400 hover:text-slate-600">清空控制台</button>
                </div>
                <div id="projectList" class="space-y-2 max-h-48 overflow-y-auto scrollbar-thin">
                    <p class="text-xs text-slate-400 text-center py-4">暂无历史项目</p>
                </div>
            </div>

            <!-- 阶段一：产品锚定 -->
            <div class="p-4 border-b border-slate-200">
                <div class="flex items-center gap-2 mb-4">
                    <div class="w-6 h-6 rounded-full bg-indigo-600 text-white text-xs flex items-center justify-center font-medium">1</div>
                    <h3 class="text-sm font-semibold text-slate-700">阶段一：产品资产锚定</h3>
                </div>

                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">产品名称</label>
                        <input type="text" id="productName" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 outline-none" placeholder="输入产品名称">
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">产品参考图 (最多5张)</label>
                        <div id="uploadZone1" class="border-2 border-dashed border-slate-200 rounded-lg p-4 text-center hover:border-indigo-400 transition-colors cursor-pointer">
                            <input type="file" id="productImages" multiple accept="image/*" class="hidden">
                            <svg class="w-8 h-8 mx-auto text-slate-300 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                            </svg>
                            <p class="text-xs text-slate-400">点击上传产品图片</p>
                        </div>
                        <div id="imagePreviewGrid" class="grid grid-cols-5 gap-2 mt-2"></div>
                    </div>

                    <button onclick="analyzeProduct()" id="analyzeBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium py-2.5 px-4 rounded-lg transition-colors flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"></path>
                        </svg>
                        提取产品特征
                    </button>

                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">锚定词 (Anchor Prompt)</label>
                        <textarea id="anchorPrompt" rows="3" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 outline-none resize-none" placeholder="AI 提取的产品特征将显示在这里，可手动编辑"></textarea>
                    </div>
                </div>
            </div>

            <!-- 阶段二：分镜生成 -->
            <div class="p-4 flex-1 overflow-y-auto">
                <div class="flex items-center gap-2 mb-4">
                    <div class="w-6 h-6 rounded-full bg-purple-600 text-white text-xs flex items-center justify-center font-medium">2</div>
                    <h3 class="text-sm font-semibold text-slate-700">阶段二：分镜脚本生成</h3>
                </div>

                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">镜头需求表 (CSV/Excel)</label>
                        <div id="uploadZone2" class="border-2 border-dashed border-slate-200 rounded-lg p-4 text-center hover:border-purple-400 transition-colors cursor-pointer">
                            <input type="file" id="requirementsFile" accept=".csv,.xlsx,.xls" class="hidden">
                            <svg class="w-8 h-8 mx-auto text-slate-300 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                            </svg>
                            <p class="text-xs text-slate-400">点击上传需求表</p>
                        </div>
                        <div id="fileInfo" class="hidden mt-2 p-2 bg-slate-50 rounded-lg flex items-center justify-between">
                            <span id="fileName" class="text-xs text-slate-600 truncate"></span>
                            <button onclick="removeFile()" class="text-slate-400 hover:text-red-500">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <button onclick="generateScript()" id="generateBtn" class="w-full bg-purple-600 hover:bg-purple-700 text-white text-sm font-medium py-2.5 px-4 rounded-lg transition-colors flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                        </svg>
                        生成专业脚本
                    </button>

                    <div class="text-xs text-slate-400 space-y-1">
                        <p>1. 先上传产品图，点击"提取产品特征"</p>
                        <p>2. 确认锚定词后，上传需求表</p>
                        <p>3. 点击"生成专业脚本"</p>
                    </div>
                </div>
            </div>

            <!-- 版权信息 -->
            <div class="p-4 border-t border-slate-200 text-center">
                <p class="text-xs text-slate-400">© 2026 浩涵 All Rights Reserved</p>
            </div>
        </aside>

        <!-- 右侧制片控制台 -->
        <main class="col-span-8 bg-slate-900 flex flex-col">
            <!-- 控制台头部 -->
            <div class="px-4 py-3 border-b border-slate-700 flex items-center justify-between bg-slate-800">
                <div class="flex items-center gap-3">
                    <div class="flex gap-1.5">
                        <div class="w-3 h-3 rounded-full bg-red-500"></div>
                        <div class="w-3 h-3 rounded-full bg-yellow-500"></div>
                        <div class="w-3 h-3 rounded-full bg-green-500"></div>
                    </div>
                    <span class="text-sm text-slate-400 font-mono">制片控制台 (Console)</span>
                </div>
                <div class="flex items-center gap-3">
                    <button onclick="copyConsole()" class="text-xs text-slate-400 hover:text-white transition-colors">复制</button>
                    <button onclick="downloadConsole()" class="text-xs text-slate-400 hover:text-white transition-colors">下载</button>
                </div>
            </div>

            <!-- 控制台内容 -->
            <div id="console" class="flex-1 p-6 overflow-y-auto scrollbar-thin console-output">
                <div class="text-center text-slate-500 py-12">
                    <svg class="w-16 h-16 mx-auto text-slate-600 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                    </svg>
                    <p class="text-lg font-medium text-slate-400">等待指令</p>
                    <p class="text-sm mt-1">请在左侧完成产品锚定后生成分镜脚本</p>
                </div>
            </div>

            <!-- 控制台状态栏 -->
            <div class="px-4 py-2 border-t border-slate-700 bg-slate-800 flex items-center justify-between text-xs">
                <div class="flex items-center gap-4">
                    <span id="statusText" class="text-slate-400">就绪</span>
                </div>
                <div class="flex items-center gap-2 text-slate-500">
                    <span id="charCount">0</span> chars
                </div>
            </div>
        </main>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast"></div>

    <script>
        // ==================== 全局状态 ====================
        let uploadedImages = [];
        let currentProjectId = null;
        let accumulatedContent = '';

        // ==================== 初始化 ====================
        document.addEventListener('DOMContentLoaded', () => {
            loadProjects();
            setupUploadZones();
        });

        // ==================== 加载历史项目 ====================
        async function loadProjects() {
            try {
                const response = await fetch('/api/projects');
                const data = await response.json();
                const container = document.getElementById('projectList');

                if (data.projects && data.projects.length > 0) {
                    container.innerHTML = data.projects.map(p => `
                        <div class="p-2 rounded-lg hover:bg-slate-50 cursor-pointer group transition-colors" onclick="loadProject(${p.id})">
                            <div class="flex items-center justify-between">
                                <div class="flex-1 min-w-0">
                                    <p class="text-sm text-slate-700 truncate">${escapeHtml(p.project_name)}</p>
                                    <p class="text-xs text-slate-400">${formatDate(p.updated_at || p.created_at)}</p>
                                </div>
                                <button onclick="event.stopPropagation(); deleteProject(${p.id})" class="opacity-0 group-hover:opacity-100 text-slate-400 hover:text-red-500 p-1">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                                    </svg>
                                </button>
                            </div>
                        </div>
                    `).join('');
                } else {
                    container.innerHTML = '<p class="text-xs text-slate-400 text-center py-4">暂无历史项目</p>';
                }
            } catch (error) {
                console.error('加载项目失败:', error);
            }
        }

        // ==================== 设置上传区 ====================
        function setupUploadZones() {
            // 产品图片上传
            const zone1 = document.getElementById('uploadZone1');
            const input1 = document.getElementById('productImages');
            zone1.addEventListener('click', () => input1.click());
            zone1.addEventListener('dragover', e => { e.preventDefault(); zone1.classList.add('border-indigo-400', 'bg-indigo-50'); });
            zone1.addEventListener('dragleave', () => zone1.classList.remove('border-indigo-400', 'bg-indigo-50'));
            zone1.addEventListener('drop', e => {
                e.preventDefault();
                zone1.classList.remove('border-indigo-400', 'bg-indigo-50');
                handleImageFiles(e.dataTransfer.files);
            });
            input1.addEventListener('change', () => handleImageFiles(input1.files));

            // 需求表上传
            const zone2 = document.getElementById('uploadZone2');
            const input2 = document.getElementById('requirementsFile');
            zone2.addEventListener('click', () => input2.click());
            zone2.addEventListener('dragover', e => { e.preventDefault(); zone2.classList.add('border-purple-400', 'bg-purple-50'); });
            zone2.addEventListener('dragleave', () => zone2.classList.remove('border-purple-400', 'bg-purple-50'));
            zone2.addEventListener('drop', e => {
                e.preventDefault();
                zone2.classList.remove('border-purple-400', 'bg-purple-50');
                if (e.dataTransfer.files.length) {
                    input2.files = e.dataTransfer.files;
                    showFileInfo(e.dataTransfer.files[0]);
                }
            });
            input2.addEventListener('change', () => {
                if (input2.files.length) showFileInfo(input2.files[0]);
            });
        }

        // ==================== 图片处理 ====================
        async function handleImageFiles(files) {
            const remaining = 5 - uploadedImages.length;
            const toAdd = Array.from(files).slice(0, remaining);

            for (const file of toAdd) {
                if (file.type.startsWith('image/')) {
                    try {
                        const compressed = await compressImageFile(file);
                        const reader = new FileReader();
                        reader.onload = (e) => {
                            uploadedImages.push({
                                file: compressed,
                                preview: e.target.result,
                                name: file.name
                            });
                            renderImagePreviews();
                        };
                        reader.readAsDataURL(compressed);
                    } catch (err) {
                        console.error('图片处理失败:', err);
                    }
                }
            }

            if (files.length > remaining) {
                showToast(`最多上传 5 张图片`);
            }
        }

        async function compressImageFile(file, maxSize = 1024, quality = 0.8) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;
                    if (width > maxSize || height > maxSize) {
                        const ratio = Math.min(maxSize / width, maxSize / height);
                        width = Math.round(width * ratio);
                        height = Math.round(height * ratio);
                    }
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    canvas.toBlob(
                        blob => blob ? resolve(new File([blob], file.name, { type: 'image/jpeg' })) : resolve(file),
                        'image/jpeg', quality
                    );
                };
                img.onerror = reject;
                img.src = URL.createObjectURL(file);
            });
        }

        function renderImagePreviews() {
            const container = document.getElementById('imagePreviewGrid');
            if (uploadedImages.length === 0) {
                container.innerHTML = '';
                return;
            }
            container.innerHTML = uploadedImages.map((img, index) => `
                <div class="image-preview-card">
                    <img src="${img.preview}" alt="Preview">
                    <button class="delete-btn" onclick="removeImage(${index})">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                        </svg>
                    </button>
                </div>
            `).join('');
        }

        function removeImage(index) {
            uploadedImages.splice(index, 1);
            renderImagePreviews();
        }

        // ==================== 文件处理 ====================
        function showFileInfo(file) {
            const fileInfo = document.getElementById('fileInfo');
            const fileName = document.getElementById('fileName');
            fileName.textContent = file.name;
            fileInfo.classList.remove('hidden');
        }

        function removeFile() {
            document.getElementById('requirementsFile').value = '';
            document.getElementById('fileInfo').classList.add('hidden');
        }

        // ==================== 阶段一：产品分析 ====================
        async function analyzeProduct() {
            const productName = document.getElementById('productName').value.trim() || '未命名产品';
            const btn = document.getElementById('analyzeBtn');

            if (uploadedImages.length === 0) {
                showToast('请先上传产品图片');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<div class="spinner"></div> 分析中...';
            setConsoleStatus('正在分析产品特征...');

            const formData = new FormData();
            formData.append('product_name', productName);
            uploadedImages.forEach(img => formData.append('images', img.file));

            try {
                const response = await fetch('/api/analyze_product', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.success) {
                    document.getElementById('anchorPrompt').value = data.anchor_prompt;
                    currentProjectId = data.project_id;
                    showToast('产品特征提取成功');
                    setConsoleStatus('产品锚定完成，可进入阶段二');
                    loadProjects();
                } else {
                    showToast(data.error || '分析失败');
                    setConsoleStatus('分析失败');
                }
            } catch (error) {
                console.error('分析失败:', error);
                showToast('网络错误，请重试');
                setConsoleStatus('分析失败');
            } finally {
                btn.disabled = false;
                btn.innerHTML = `
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"></path>
                    </svg>
                    提取产品特征
                `;
            }
        }

        // ==================== 阶段二：分镜生成 ====================
        async function generateScript() {
            const anchorPrompt = document.getElementById('anchorPrompt').value.trim();
            const requirementsFile = document.getElementById('requirementsFile').files[0];
            const btn = document.getElementById('generateBtn');

            if (!anchorPrompt) {
                showToast('请先完成阶段一，提取产品特征');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<div class="spinner"></div> 生成中...';
            setConsoleStatus('正在生成专业分镜脚本...');

            // 清空控制台，开始新输出
            accumulatedContent = '';
            document.getElementById('console').innerHTML = '';
            document.getElementById('charCount').textContent = '0';

            const formData = new FormData();
            formData.append('anchor_prompt', anchorPrompt);
            formData.append('project_id', currentProjectId || '');
            if (requirementsFile) {
                formData.append('requirements', requirementsFile);
            }

            try {
                const response = await fetch('/api/generate_script', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                // 使用 Reader 处理流式响应
                const reader = response.body.getReader();
                const decoder = new TextDecoder();

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value, { stream: true });
                    const lines = chunk.split('\n');

                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            try {
                                const data = JSON.parse(line.slice(6));
                                handleStreamEvent(data);
                            } catch (e) {
                                // 忽略解析错误
                            }
                        }
                    }
                }
            } catch (error) {
                console.error('生成失败:', error);
                showToast('生成失败: ' + error.message);
                setConsoleStatus('生成失败');
                btn.disabled = false;
                btn.innerHTML = `
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                    </svg>
                    生成专业脚本
                `;
            }
        }

        // ==================== 流式事件处理 ====================
        function handleStreamEvent(data) {
            const console = document.getElementById('console');
            const btn = document.getElementById('generateBtn');
            const charCount = document.getElementById('charCount');

            switch (data.type) {
                case 'start':
                    console.innerHTML = '';
                    setConsoleStatus(data.message);
                    break;

                case 'chunk':
                    accumulatedContent += data.content;
                    charCount.textContent = accumulatedContent.length;
                    // 渲染 Markdown
                    console.innerHTML = marked.parse(accumulatedContent);
                    // 滚动到底部
                    console.scrollTop = console.scrollHeight;
                    break;

                case 'done':
                    setConsoleStatus('生成完成');
                    showToast('分镜脚本生成完成');
                    loadProjects();
                    btn.disabled = false;
                    btn.innerHTML = `
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                        </svg>
                        生成专业脚本
                    `;
                    break;

                case 'error':
                    setConsoleStatus('生成失败');
                    showToast('错误: ' + data.message);
                    btn.disabled = false;
                    btn.innerHTML = `
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                        </svg>
                        生成专业脚本
                    `;
                    break;

                case 'saved':
                    showToast('已保存到历史记录');
                    break;
            }
        }

        // ==================== 控制台操作 ====================
        function setConsoleStatus(text) {
            document.getElementById('statusText').textContent = text;
        }

        function clearConsole() {
            accumulatedContent = '';
            document.getElementById('console').innerHTML = `
                <div class="text-center text-slate-500 py-12">
                    <svg class="w-16 h-16 mx-auto text-slate-600 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                    </svg>
                    <p class="text-lg font-medium text-slate-400">等待指令</p>
                    <p class="text-sm mt-1">请在左侧完成产品锚定后生成分镜脚本</p>
                </div>
            `;
            document.getElementById('charCount').textContent = '0';
            setConsoleStatus('就绪');
        }

        function copyConsole() {
            if (accumulatedContent) {
                navigator.clipboard.writeText(accumulatedContent).then(() => showToast('已复制到剪贴板')).catch(() => showToast('复制失败'));
            }
        }

        function downloadConsole() {
            if (accumulatedContent) {
                const blob = new Blob([accumulatedContent], { type: 'text/markdown' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `分镜脚本_${new Date().toISOString().slice(0, 10)}.md`;
                a.click();
                URL.revokeObjectURL(url);
                showToast('开始下载');
            }
        }

        // ==================== 项目管理 ====================
        async function loadProject(projectId) {
            try {
                const response = await fetch(`/api/projects/${projectId}`);
                const data = await response.json();

                if (data.success && data.project) {
                    const project = data.project;

                    // 回填表单
                    document.getElementById('productName').value = project.product_name || '';
                    document.getElementById('anchorPrompt').value = project.anchor_prompt || '';
                    currentProjectId = project.id;

                    // 渲染历史脚本
                    if (project.storyboard_content) {
                        accumulatedContent = project.storyboard_content;
                        document.getElementById('console').innerHTML = marked.parse(accumulatedContent);
                        document.getElementById('charCount').textContent = accumulatedContent.length;
                        setConsoleStatus('已加载历史项目');
                    } else {
                        clearConsole();
                    }

                    showToast('已加载: ' + project.project_name);
                }
            } catch (error) {
                console.error('加载失败:', error);
                showToast('加载项目失败');
            }
        }

        async function deleteProject(projectId) {
            if (!confirm('确定删除此项目？')) return;

            try {
                const response = await fetch(`/api/projects/${projectId}`, { method: 'DELETE' });
                const data = await response.json();

                if (data.success) {
                    showToast('已删除');
                    loadProjects();
                    if (currentProjectId === projectId) {
                        clearConsole();
                        currentProjectId = null;
                    }
                }
            } catch (error) {
                showToast('删除失败');
            }
        }

        // ==================== 工具函数 ====================
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatDate(dateStr) {
            const date = new Date(dateStr);
            const now = new Date();
            const diff = now - date;
            if (diff < 60000) return '刚刚';
            if (diff < 3600000) return `${Math.floor(diff / 60000)} 分钟前`;
            if (diff < 86400000) return `${Math.floor(diff / 3600000)} 小时前`;
            return date.toLocaleDateString('zh-CN');
        }
    </script>
</body>
