<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 商业视频制片工作台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.2.0/github-markdown.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .markdown-body { box-sizing: border-box; }
        .markdown-body pre { background: #1e293b; border-radius: 8px; padding: 16px; overflow-x: auto; }
        .markdown-body code { background: #f1f5f9; padding: 2px 6px; border-radius: 4px; font-size: 14px; }
        .markdown-body pre code { background: transparent; padding: 0; }
        .markdown-body table { border-collapse: collapse; width: 100%; margin: 16px 0; }
        .markdown-body table th { background: #f8fafc; border: 1px solid #e2e8f0; padding: 12px; text-align: left; font-weight: 600; }
        .markdown-body table td { border: 1px solid #e2e8f0; padding: 12px; vertical-align: top; }
        .markdown-body table tr:nth-child(even) { background: #f8fafc; }
        .scrollbar-thin::-webkit-scrollbar { width: 6px; }
        .scrollbar-thin::-webkit-scrollbar-track { background: #f1f5f9; }
        .scrollbar-thin::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        .scrollbar-thin::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .pulse-dot { animation: pulse 2s infinite; }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .image-preview {
            transition: all 0.2s ease;
        }
        .image-preview:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.2);
        }
        .loading-shimmer {
            background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">
    <div class="flex min-h-screen">
        <!-- 左侧边栏 - 历史项目 -->
        <aside class="w-80 bg-white border-r border-slate-200 flex flex-col shadow-sm">
            <!-- Logo 区域 -->
            <div class="p-6 border-b border-slate-100">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-xl flex items-center justify-center">
                        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                        </svg>
                    </div>
                    <div>
                        <h1 class="text-lg font-bold text-slate-800">视频制片工作台</h1>
                        <p class="text-xs text-slate-500">AI 商业视频分镜生成</p>
                    </div>
                </div>
            </div>

            <!-- 新建项目按钮 -->
            <div class="p-4">
                <button onclick="createNewProject()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 px-4 rounded-xl transition-all duration-200 flex items-center justify-center gap-2 shadow-lg shadow-indigo-500/25">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                    </svg>
                    新建项目
                </button>
            </div>

            <!-- 项目列表 -->
            <div class="flex-1 overflow-y-auto scrollbar-thin p-4" id="projectList">
                <div class="text-xs font-medium text-slate-400 uppercase tracking-wider mb-3">历史项目</div>
                <div id="projectsContainer" class="space-y-2">
                    <!-- 项目列表将动态加载 -->
                </div>
            </div>
        </aside>

        <!-- 主工作区 -->
        <main class="flex-1 overflow-y-auto scrollbar-thin">
            <div class="max-w-5xl mx-auto p-8">
                <!-- 页面标题 -->
                <div class="mb-8">
                    <h2 class="text-2xl font-bold text-slate-800">新建商业视频分镜</h2>
                    <p class="text-slate-500 mt-1">填写产品信息，上传参考图，AI 将为您生成专业的分镜脚本</p>
                </div>

                <!-- 主工作卡片 -->
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                    <!-- 步骤指示器 -->
                    <div class="border-b border-slate-100 px-6 py-4">
                        <div class="flex items-center gap-2">
                            <div class="flex items-center gap-2" id="step1Indicator">
                                <div class="w-8 h-8 rounded-full bg-indigo-600 text-white flex items-center justify-center text-sm font-medium">1</div>
                                <span class="text-sm font-medium text-slate-700">产品信息</span>
                            </div>
                            <div class="flex-1 h-px bg-slate-200 mx-4"></div>
                            <div class="flex items-center gap-2 opacity-50" id="step2Indicator">
                                <div class="w-8 h-8 rounded-full bg-slate-200 text-slate-500 flex items-center justify-center text-sm font-medium">2</div>
                                <span class="text-sm font-medium text-slate-500">生成结果</span>
                            </div>
                        </div>
                    </div>

                    <!-- Step 1: 产品信息表单 -->
                    <div id="step1" class="p-6">
                        <form id="productForm" class="space-y-8">
                            <!-- 项目名称 -->
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-2">项目名称</label>
                                <input type="text" name="project_name" required
                                    class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 outline-none transition-all"
                                    placeholder="例如：XXX产品商业视频">
                            </div>

                            <!-- 产品基本信息 -->
                            <div class="grid grid-cols-2 gap-6">
                                <div>
                                    <label class="block text-sm font-medium text-slate-700 mb-2">产品名称</label>
                                    <input type="text" name="product_name"
                                        class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 outline-none transition-all"
                                        placeholder="产品名称">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-slate-700 mb-2">材质与颜色</label>
                                    <input type="text" name="material_color"
                                        class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 outline-none transition-all"
                                        placeholder="例如：铝合金，银灰色">
                                </div>
                            </div>

                            <div class="grid grid-cols-2 gap-6">
                                <div>
                                    <label class="block text-sm font-medium text-slate-700 mb-2">精确尺寸</label>
                                    <input type="text" name="dimensions"
                                        class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 outline-none transition-all"
                                        placeholder="例如：120×60×80cm">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-slate-700 mb-2">产品功能</label>
                                    <input type="text" name="function"
                                        class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 outline-none transition-all"
                                        placeholder="产品的主要功能">
                                </div>
                            </div>

                            <!-- 卖点 -->
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-2">卖点描述</label>
                                <textarea name="selling_points" rows="2"
                                    class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 outline-none transition-all resize-none"
                                    placeholder="产品的核心卖点，用于吸引消费者"></textarea>
                            </div>

                            <!-- 视觉红线 -->
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-2">
                                    视觉红线
                                    <span class="text-slate-400 font-normal ml-1">(禁止修改的视觉元素)</span>
                                </label>
                                <textarea name="red_lines" rows="2"
                                    class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 outline-none transition-all resize-none"
                                    placeholder="例如：Logo位置、产品比例、颜色准确性"></textarea>
                            </div>

                            <!-- 需求表上传 -->
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-2">
                                    镜头需求表
                                    <span class="text-slate-400 font-normal ml-1">(可选上传 CSV/Excel)</span>
                                </label>
                                <div class="border-2 border-dashed border-slate-200 rounded-xl p-6 text-center hover:border-indigo-400 transition-colors cursor-pointer" id="uploadZone">
                                    <input type="file" id="requirementsFile" name="requirements" accept=".csv,.xlsx,.xls" class="hidden">
                                    <svg class="w-10 h-10 mx-auto text-slate-300 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                                    </svg>
                                    <p class="text-slate-500 mb-1">点击或拖拽上传需求表</p>
                                    <p class="text-xs text-slate-400">支持 CSV、Excel 格式</p>
                                </div>
                                <div id="fileInfo" class="hidden mt-3 p-3 bg-slate-50 rounded-lg flex items-center justify-between">
                                    <div class="flex items-center gap-3">
                                        <svg class="w-5 h-5 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                                        </svg>
                                        <span id="fileName" class="text-sm text-slate-700"></span>
                                    </div>
                                    <button type="button" onclick="removeFile()" class="text-slate-400 hover:text-red-500 transition-colors">
                                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                                        </svg>
                                    </button>
                                </div>
                            </div>

                            <!-- 产品参考图上传 -->
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-2">
                                    产品参考图
                                    <span class="text-slate-400 font-normal ml-1">(最多 10 张，支持 AI 视觉分析)</span>
                                </label>
                                <div class="border-2 border-dashed border-slate-200 rounded-xl p-6 hover:border-indigo-400 transition-colors cursor-pointer" id="imageUploadZone">
                                    <input type="file" id="imageFiles" name="images" multiple accept="image/*" class="hidden">
                                    <svg class="w-10 h-10 mx-auto text-slate-300 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                                    </svg>
                                    <p class="text-slate-500 mb-1">点击或拖拽上传产品图片</p>
                                    <p class="text-xs text-slate-400">支持 JPG、PNG、WebP 格式</p>
                                </div>
                                <!-- 图片预览网格 -->
                                <div id="imagePreview" class="grid grid-cols-5 gap-4 mt-4"></div>
                            </div>

                            <!-- 提交按钮 -->
                            <div class="flex justify-end pt-4">
                                <button type="submit" id="submitBtn"
                                    class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 px-8 rounded-xl transition-all duration-200 flex items-center gap-2 shadow-lg shadow-indigo-500/25 disabled:opacity-50 disabled:cursor-not-allowed">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                                    </svg>
                                    开始生成分镜
                                </button>
                            </div>
                        </form>
                    </div>

                    <!-- Step 2: 生成结果 -->
                    <div id="step2" class="hidden p-6">
                        <!-- 生成状态 -->
                        <div id="generatingState" class="hidden">
                            <div class="flex items-center justify-center py-12">
                                <div class="text-center">
                                    <div class="w-16 h-16 mx-auto mb-4 relative">
                                        <div class="absolute inset-0 border-4 border-indigo-200 rounded-full"></div>
                                        <div class="absolute inset-0 border-4 border-indigo-600 rounded-full border-t-transparent animate-spin"></div>
                                    </div>
                                    <p class="text-slate-600 font-medium" id="generatingMessage">正在生成...</p>
                                    <p class="text-xs text-slate-400 mt-2">请稍候，AI 正在创作中</p>
                                </div>
                            </div>
                        </div>

                        <!-- 生成结果 -->
                        <div id="resultState" class="hidden">
                            <!-- 操作栏 -->
                            <div class="flex items-center justify-between mb-6 pb-4 border-b border-slate-100">
                                <div class="flex items-center gap-2">
                                    <div class="w-3 h-3 rounded-full bg-emerald-500"></div>
                                    <span class="text-sm font-medium text-emerald-600">生成完成</span>
                                </div>
                                <div class="flex items-center gap-3">
                                    <button onclick="copyResult()" class="text-slate-500 hover:text-slate-700 transition-colors flex items-center gap-1.5 text-sm">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                                        </svg>
                                        复制
                                    </button>
                                    <button onclick="downloadResult()" class="text-slate-500 hover:text-slate-700 transition-colors flex items-center gap-1.5 text-sm">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                                        </svg>
                                        下载
                                    </button>
                                    <button onclick="resetForm()" class="text-indigo-600 hover:text-indigo-700 transition-colors flex items-center gap-1.5 text-sm font-medium">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                                        </svg>
                                        新建项目
                                    </button>
                                </div>
                            </div>

                            <!-- Markdown 结果 -->
                            <div id="storyboardResult" class="markdown-body prose prose-slate max-w-none min-h-[400px] p-4 bg-slate-50 rounded-xl"></div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Toast 通知 -->
    <div id="toast" class="fixed bottom-6 right-6 transform translate-y-full opacity-0 transition-all duration-300 pointer-events-none z-50">
        <div class="bg-slate-800 text-white px-4 py-3 rounded-lg shadow-lg flex items-center gap-3">
            <svg id="toastIcon" class="w-5 h-5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
            </svg>
            <span id="toastMessage" class="text-sm">操作成功</span>
        </div>
    </div>

    <script>
        // 全局变量
        let uploadedImages = [];
        let currentResult = '';

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            loadProjects();
            setupUploadZone();
            setupImageUploadZone();
            setupFormSubmit();
        });

        // 加载项目列表
        async function loadProjects() {
            try {
                const response = await fetch('/api/projects');
                const data = await response.json();

                const container = document.getElementById('projectsContainer');

                if (data.projects && data.projects.length > 0) {
                    container.innerHTML = data.projects.map(project => `
                        <div class="project-item p-3 rounded-lg hover:bg-slate-50 cursor-pointer transition-colors group" onclick="loadProject(${project.id})">
                            <div class="flex items-center justify-between">
                                <div class="flex-1 min-w-0">
                                    <p class="text-sm font-medium text-slate-700 truncate">${escapeHtml(project.project_name)}</p>
                                    <p class="text-xs text-slate-400 mt-0.5">${formatDate(project.updated_at)}</p>
                                </div>
                                <button onclick="event.stopPropagation(); deleteProject(${project.id})" class="opacity-0 group-hover:opacity-100 text-slate-400 hover:text-red-500 transition-all p-1">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                                    </svg>
                                </button>
                            </div>
                        </div>
                    `).join('');
                } else {
                    container.innerHTML = '<p class="text-sm text-slate-400 text-center py-4">暂无历史项目</p>';
                }
            } catch (error) {
                console.error('加载项目失败:', error);
            }
        }

        // 设置需求表上传区
        function setupUploadZone() {
            const zone = document.getElementById('uploadZone');
            const input = document.getElementById('requirementsFile');

            zone.addEventListener('click', () => input.click());

            zone.addEventListener('dragover', (e) => {
                e.preventDefault();
                zone.classList.add('border-indigo-400', 'bg-indigo-50');
            });

            zone.addEventListener('dragleave', () => {
                zone.classList.remove('border-indigo-400', 'bg-indigo-50');
            });

            zone.addEventListener('drop', (e) => {
                e.preventDefault();
                zone.classList.remove('border-indigo-400', 'bg-indigo-50');
                if (e.dataTransfer.files.length) {
                    input.files = e.dataTransfer.files;
                    showFileInfo(e.dataTransfer.files[0]);
                }
            });

            input.addEventListener('change', () => {
                if (input.files.length) {
                    showFileInfo(input.files[0]);
                }
            });
        }

        // 显示文件信息
        function showFileInfo(file) {
            const fileInfo = document.getElementById('fileInfo');
            const fileName = document.getElementById('fileName');
            fileName.textContent = file.name;
            fileInfo.classList.remove('hidden');
        }

        // 移除文件
        function removeFile() {
            document.getElementById('requirementsFile').value = '';
            document.getElementById('fileInfo').classList.add('hidden');
        }

        // 设置图片上传区
        function setupImageUploadZone() {
            const zone = document.getElementById('imageUploadZone');
            const input = document.getElementById('imageFiles');

            zone.addEventListener('click', () => input.click());

            zone.addEventListener('dragover', (e) => {
                e.preventDefault();
                zone.classList.add('border-indigo-400', 'bg-indigo-50');
            });

            zone.addEventListener('dragleave', () => {
                zone.classList.remove('border-indigo-400', 'bg-indigo-50');
            });

            zone.addEventListener('drop', (e) => {
                e.preventDefault();
                zone.classList.remove('border-indigo-400', 'bg-indigo-50');
                handleImageFiles(e.dataTransfer.files);
            });

            input.addEventListener('change', () => {
                handleImageFiles(input.files);
            });
        }

        // 处理图片文件
        function handleImageFiles(files) {
            const remaining = 10 - uploadedImages.length;
            const toAdd = Array.from(files).slice(0, remaining);

            toAdd.forEach(file => {
                if (file.type.startsWith('image/')) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        uploadedImages.push({
                            file: file,
                            preview: e.target.result
                        });
                        renderImagePreviews();
                    };
                    reader.readAsDataURL(file);
                }
            });

            if (files.length > remaining) {
                showToast(`最多只能上传 10 张图片，已添加 ${remaining} 张`, 'warning');
            }
        }

        // 渲染图片预览
        function renderImagePreviews() {
            const container = document.getElementById('imagePreview');

            if (uploadedImages.length === 0) {
                container.innerHTML = '';
                return;
            }

            container.innerHTML = uploadedImages.map((img, index) => `
                <div class="image-preview relative aspect-square rounded-lg overflow-hidden bg-slate-100 border border-slate-200">
                    <img src="${img.preview}" alt="Preview ${index + 1}" class="w-full h-full object-cover">
                    <button onclick="removeImage(${index})" class="absolute top-1 right-1 w-6 h-6 bg-red-500 text-white rounded-full flex items-center justify-center opacity-0 hover:opacity-100 transition-opacity">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                        </svg>
                    </button>
                    <div class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black/50 to-transparent p-2">
                        <span class="text-xs text-white">${img.file.name.substring(0, 10)}...</span>
                    </div>
                </div>
            `).join('');
        }

        // 移除图片
        function removeImage(index) {
            uploadedImages.splice(index, 1);
            renderImagePreviews();
        }

        // 设置表单提交
        function setupFormSubmit() {
            const form = document.getElementById('productForm');
            const submitBtn = document.getElementById('submitBtn');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();

                // 收集表单数据
                const formData = new FormData(form);

                // 添加图片
                uploadedImages.forEach((img, index) => {
                    formData.append('images', img.file);
                });

                // 添加产品元数据
                const productMetadata = {
                    project_name: formData.get('project_name'),
                    product_name: formData.get('product_name'),
                    material_color: formData.get('material_color'),
                    dimensions: formData.get('dimensions'),
                    function: formData.get('function'),
                    selling_points: formData.get('selling_points'),
                    red_lines: formData.get('red_lines'),
                    requirements: formData.get('requirements')
                };
                formData.set('productMetadata', JSON.stringify(productMetadata));

                // 显示加载状态
                showGeneratingState();
                submitBtn.disabled = true;

                try {
                    const response = await fetch('/api/generate', {
                        method: 'POST',
                        body: formData
                    });

                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }

                    // 处理流式响应
                    const reader = response.body.getReader();
                    const decoder = new TextDecoder();
                    currentResult = '';

                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;

                        const chunk = decoder.decode(value);
                        const lines = chunk.split('\n');

                        for (const line of lines) {
                            if (line.startsWith('data: ')) {
                                try {
                                    const data = JSON.parse(line.slice(6));
                                    handleStreamEvent(data);
                                } catch (parseError) {
                                    console.error('解析事件失败:', parseError);
                                }
                            }
                        }
                    }
                } catch (error) {
                    console.error('生成失败:', error);
                    showToast('生成失败: ' + error.message, 'error');
                    showStep1();
                } finally {
                    submitBtn.disabled = false;
                }
            });
        }

        // 处理流事件
        function handleStreamEvent(data) {
            switch (data.type) {
                case 'start':
                    document.getElementById('generatingMessage').textContent = data.message;
                    break;

                case 'chunk':
                    currentResult += data.content;
                    document.getElementById('storyboardResult').innerHTML = marked.parse(currentResult);
                    // 滚动到底部
                    document.getElementById('storyboardResult').scrollIntoView({ behavior: 'smooth', block: 'end' });
                    break;

                case 'done':
                    showResultState();
                    showToast('分镜脚本生成完成！', 'success');
                    loadProjects();
                    break;

                case 'error':
                    showToast('错误: ' + data.message, 'error');
                    showStep1();
                    break;

                case 'saved':
                    showToast('项目已保存到历史记录', 'success');
                    break;

                case 'save_warning':
                    showToast(data.message, 'warning');
                    break;
            }
        }

        // 显示生成状态
        function showGeneratingState() {
            document.getElementById('step1').classList.add('hidden');
            document.getElementById('step2').classList.remove('hidden');
            document.getElementById('generatingState').classList.remove('hidden');
            document.getElementById('resultState').classList.add('hidden');

            // 更新步骤指示器
            document.getElementById('step1Indicator').classList.add('opacity-50');
            document.getElementById('step2Indicator').classList.remove('opacity-50');
            document.getElementById('step2Indicator').querySelector('div').classList.remove('bg-slate-200', 'text-slate-500');
            document.getElementById('step2Indicator').querySelector('div').classList.add('bg-indigo-600', 'text-white');
        }

        // 显示结果状态
        function showResultState() {
            document.getElementById('generatingState').classList.add('hidden');
            document.getElementById('resultState').classList.remove('hidden');
        }

        // 显示 Step 1
        function showStep1() {
            document.getElementById('step1').classList.remove('hidden');
            document.getElementById('step2').classList.add('hidden');
            document.getElementById('generatingState').classList.add('hidden');
            document.getElementById('resultState').classList.add('hidden');

            // 重置步骤指示器
            document.getElementById('step1Indicator').classList.remove('opacity-50');
            document.getElementById('step2Indicator').classList.add('opacity-50');
            document.getElementById('step2Indicator').querySelector('div').classList.add('bg-slate-200', 'text-slate-500');
            document.getElementById('step2Indicator').querySelector('div').classList.remove('bg-indigo-600', 'text-white');
        }

        // 新建项目
        function createNewProject() {
            resetForm();
        }

        // 重置表单
        function resetForm() {
            document.getElementById('productForm').reset();
            uploadedImages = [];
            currentResult = '';
            renderImagePreviews();
            removeFile();
            showStep1();
        }

        // 加载项目
        async function loadProject(projectId) {
            try {
                const response = await fetch(`/api/projects/${projectId}`);
                const data = await response.json();

                if (data.success && data.project) {
                    const project = data.project;

                    // 填充表单
                    document.querySelector('[name="project_name"]').value = project.project_name || '';
                    document.querySelector('[name="product_name"]').value = project.product_name || '';
                    document.querySelector('[name="material_color"]').value = project.product_material || '';
                    document.querySelector('[name="dimensions"]').value = project.product_dimensions || '';
                    document.querySelector('[name="function"]').value = project.product_function || '';
                    document.querySelector('[name="selling_points"]').value = project.selling_points || '';
                    document.querySelector('[name="red_lines"]').value = project.red_lines || '';

                    // 显示历史内容
                    if (project.storyboard_content) {
                        currentResult = project.storyboard_content;
                        showStep2WithResult();
                    }

                    showToast('已加载项目: ' + project.project_name, 'success');
                }
            } catch (error) {
                console.error('加载项目失败:', error);
                showToast('加载项目失败', 'error');
            }
        }

        // 显示带结果的 Step 2
        function showStep2WithResult() {
            document.getElementById('step1').classList.add('hidden');
            document.getElementById('step2').classList.remove('hidden');
            document.getElementById('generatingState').classList.add('hidden');
            document.getElementById('resultState').classList.remove('hidden');
            document.getElementById('storyboardResult').innerHTML = marked.parse(currentResult);

            // 更新步骤指示器
            document.getElementById('step1Indicator').classList.add('opacity-50');
            document.getElementById('step2Indicator').classList.remove('opacity-50');
            document.getElementById('step2Indicator').querySelector('div').classList.remove('bg-slate-200', 'text-slate-500');
            document.getElementById('step2Indicator').querySelector('div').classList.add('bg-indigo-600', 'text-white');
        }

        // 删除项目
        async function deleteProject(projectId) {
            if (!confirm('确定要删除这个项目吗？')) return;

            try {
                const response = await fetch(`/api/projects/${projectId}`, {
                    method: 'DELETE'
                });
                const data = await response.json();

                if (data.success) {
                    showToast('项目已删除', 'success');
                    loadProjects();
                } else {
                    showToast(data.error || '删除失败', 'error');
                }
            } catch (error) {
                console.error('删除项目失败:', error);
                showToast('删除项目失败', 'error');
            }
        }

        // 复制结果
        function copyResult() {
            navigator.clipboard.writeText(currentResult).then(() => {
                showToast('已复制到剪贴板', 'success');
            }).catch(() => {
                showToast('复制失败', 'error');
            });
        }

        // 下载结果
        function downloadResult() {
            const blob = new Blob([currentResult], { type: 'text/markdown' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `分镜脚本_${new Date().toISOString().slice(0, 10)}.md`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast('开始下载', 'success');
        }

        // Toast 通知
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            const toastIcon = document.getElementById('toastIcon');

            toastMessage.textContent = message;

            // 设置图标
            const icons = {
                success: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>',
                error: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>',
                warning: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>'
            };

            const colors = {
                success: 'text-emerald-400',
                error: 'text-red-400',
                warning: 'text-amber-400'
            };

            toastIcon.innerHTML = icons[type] || icons.success;
            toastIcon.className = `w-5 h-5 ${colors[type] || colors.success}`;

            toast.classList.remove('translate-y-full', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-full', 'opacity-0');
            }, 3000);
        }

        // 工具函数
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatDate(dateStr) {
            const date = new Date(dateStr);
            const now = new Date();
            const diff = now - date;

            if (diff < 60000) return '刚刚';
            if (diff < 3600000) return `${Math.floor(diff / 60000)} 分钟前`;
            if (diff < 86400000) return `${Math.floor(diff / 3600000)} 小时前`;
            if (diff < 604800000) return `${Math.floor(diff / 86400000)} 天前`;

            return date.toLocaleDateString('zh-CN');
        }
    </script>
</body>
